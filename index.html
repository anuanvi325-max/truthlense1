<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthLens | AI News Verifier</title>
    <link rel="stylesheet" href="all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none; }
        
        /* Laser Scanning Animation */
        .scanning-line {
            height: 3px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            position: absolute;
            width: 100%;
            z-index: 20;
            animation: scan 1.5s linear infinite;
        }
        
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .active-tab { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.1) !important; color: #3b82f6; }
        
        button { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

<nav class="border-b border-white/10 p-5 flex justify-between items-center glass sticky top-0 z-50">
    <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 35px; height: 35px; background: linear-gradient(135deg, #3b82f6, #2563eb); border-radius: 8px; display: flex; align-items: center; justify-content: center; shadow: 0 4px 15px rgba(37, 99, 235, 0.3);">
            <i class="fa-solid fa-shield-halved text-white" style="font-size: 16px;"></i>
        </div>
        <h1 style="font-size: 22px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; margin: 0;">Truth<span style="color: #3b82f6;">Lens</span></h1>
    </div>
    <div style="font-size: 10px; font-weight: bold; color: rgba(255,255,255,0.4); letter-spacing: 2px;">ENSEMBLE v1.0</div>
</nav>

<main style="max-width: 800px; margin: 0 auto; padding: 60px 24px;">
    <div style="text-align: center; margin-bottom: 50px;">
        <h2 style="font-size: 42px; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; margin-bottom: 10px;">
            Truth<span style="color: #3b82f6;">Lens</span>
        </h2>
        <p style="color: #9ca3af; font-size: 14px; letter-spacing: 1px;">Ensemble-Based Fake News Detection System</p>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;">
        <button onclick="switchMode('photo')" id="photoTab" class="glass active-tab" style="padding: 18px; border-radius: 15px; border: 2px solid transparent; font-weight: 800; font-size: 11px; text-transform: uppercase; color: inherit;">
            <i class="fa-solid fa-camera-retro" style="margin-right: 8px;"></i> Photo Scanner
        </button>
        <button onclick="switchMode('text')" id="textTab" class="glass" style="padding: 18px; border-radius: 15px; border: 2px solid transparent; font-weight: 800; font-size: 11px; text-transform: uppercase; color: inherit;">
            <i class="fa-solid fa-file-lines" style="margin-right: 8px;"></i> Text Analysis
        </button>
    </div>

    <div class="glass" style="min-height: 450px; border-radius: 30px; padding: 40px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
        <div id="scanLine" class="scanning-line hidden"></div>

        <div id="mediaUI" style="text-align: center; padding: 40px 0;">
            <div style="width: 100px; height: 100px; background: rgba(59, 130, 246, 0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px;">
                <i class="fa-solid fa-qrcode text-5xl" style="color: #3b82f6; opacity: 0.6;"></i>
            </div>
            <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 10px; text-transform: uppercase;">Scan News Article</h3>
            <p style="color: #6b7280; font-size: 12px; margin-bottom: 35px;">Upload a photo of a newspaper or digital headline</p>
            
            <input type="file" id="fileInp" class="hidden" accept="image/*" onchange="runAnalysis()">
            <button onclick="document.getElementById('fileInp').click()" style="background: #2563eb; color: white; border: none; padding: 18px 50px; border-radius: 50px; font-weight: 900; font-size: 13px; box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);">
                CHOOSE IMAGE
            </button>
        </div>

        <div id="textUI" class="hidden" style="width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="font-size: 16px; font-weight: 800; text-transform: uppercase; color: #3b82f6;">Manual Input</h3>
                <span style="font-size: 10px; color: #4b5563;">NLP PROCESSOR ACTIVE</span>
            </div>
            <textarea id="textInp" placeholder="Paste the news content or headline here for deep analysis..." style="width: 100%; height: 180px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; color: white; outline: none; font-size: 15px; margin-bottom: 25px; box-sizing: border-box; line-height: 1.6;"></textarea>
            <button onclick="runAnalysis()" style="width: 100%; background: #2563eb; color: white; border: none; padding: 18px; border-radius: 15px; font-weight: 900; font-size: 13px; text-transform: uppercase; letter-spacing: 2px;">
                Verify Authenticity
            </button>
        </div>

        <div id="loadingUI" class="hidden" style="text-align: center; padding: 100px 0;">
            <div style="width: 50px; height: 50px; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 30px;"></div>
            <h3 style="font-size: 14px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: #3b82f6;">TruthLens Ensemble Processing...</h3>
        </div>

        <div id="resultUI" class="hidden" style="text-align: center; padding: 40px 0;">
            <div id="resIcon" style="margin-bottom: 20px;"></div>
            <h4 id="verdict" style="font-size: 80px; font-weight: 900; margin: 0; line-height: 1; letter-spacing: -4px;"></h4>
            <p id="subVerdict" style="color: #9ca3af; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; margin: 15px 0 40px; font-size: 11px;"></p>
            
            <div style="max-width: 350px; margin: 0 auto 40px; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">
                <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; margin-bottom: 10px;">
                    <span style="color: #6b7280;">ACCURACY CONFIDENCE</span>
                    <span id="confidencePerc" style="color: #3b82f6;">94.2%</span>
                </div>
                <div style="height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden;">
                    <div id="confBar" style="height: 100%; background: #3b82f6; width: 0%; transition: width 1s ease-out;"></div>
                </div>
            </div>

            <button onclick="resetApp()" style="color: #4b5563; background: none; border: none; border-bottom: 1px solid #1f2937; font-weight: 800; font-size: 10px; text-transform: uppercase; padding-bottom: 4px;">
                Reset Lens
            </button>
        </div>
    </div>

    <footer style="margin-top: 60px; text-align: center; opacity: 0.3; font-size: 10px; font-weight: bold; letter-spacing: 1px;">
        &copy; 2024 TRUTHLENS | MAHAJANA FIRST GRADE COLLEGE
    </footer>
</main>

<script>
    let currentMode = 'photo';

    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('photoTab').classList.toggle('active-tab', mode === 'photo');
        document.getElementById('textTab').classList.toggle('active-tab', mode === 'text');
        
        document.getElementById('mediaUI').classList.toggle('hidden', mode === 'text');
        document.getElementById('textUI').classList.toggle('hidden', mode !== 'text');
        document.getElementById('resultUI').classList.add('hidden');
    }

    function runAnalysis() {
        // Trigger UI changes
        document.getElementById('mediaUI').classList.add('hidden');
        document.getElementById('textUI').classList.add('hidden');
        document.getElementById('loadingUI').classList.remove('hidden');
        document.getElementById('scanLine').classList.remove('hidden');

        // Simulate Ensemble Processing Delay
        setTimeout(() => {
            const isAuthentic = Math.random() > 0.3; // Simulated logic
            displayResult(isAuthentic);
        }, 2500);
    }

    function displayResult(isTrue) {
        document.getElementById('loadingUI').classList.add('hidden');
        document.getElementById('scanLine').classList.add('hidden');
        
        const v = document.getElementById('verdict');
        const sv = document.getElementById('subVerdict');
        const icon = document.getElementById('resIcon');
        const bar = document.getElementById('confBar');

        v.innerText = isTrue ? "REAL" : "FAKE";
        v.style.color = isTrue ? "#22c55e" : "#ef4444";
        
        sv.innerText = isTrue ? "Verified Information" : "Misinformation Detected";
        
        icon.innerHTML = isTrue ? 
            '<i class="fa-solid fa-circle-check" style="color: #22c55e; font-size: 60px;"></i>' : 
            '<i class="fa-solid fa-triangle-exclamation" style="color: #ef4444; font-size: 60px;"></i>';
        
        document.getElementById('resultUI').classList.remove('hidden');
        
        // Animate confidence bar
        setTimeout(() => {
            bar.style.width = isTrue ? "94%" : "88%";
        }, 100);
    }

    function resetApp() {
        document.getElementById('resultUI').classList.add('hidden');
        document.getElementById('fileInp').value = "";
        document.getElementById('textInp').value = "";
        document.getElementById('confBar').style.width = "0%";
        switchMode(currentMode);
    }
</script>
</body>
</html>
